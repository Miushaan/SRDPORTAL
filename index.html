function normalizePin(val, fallback) {
  const s = val !== undefined && val !== null ? String(val).trim() : "";
  return /^\d{4,6}$/.test(s) ? s : fallback;
}

function buildCanonicalPeople(existingPeople) {
  const existing = Array.isArray(existingPeople) ? existingPeople.filter(Boolean) : [];
  const fixed = FIXED_USERS.map((u, idx) => {
    const match = existing.find(p => Number(p.id) === u.id || String(p.name || "").trim().toLowerCase() === u.name.toLowerCase());
    return {
      id: u.id,
      name: u.name,
      color: (match && match.color) || PALETTE[idx % PALETTE.length],
      pin: normalizePin(match && match.pin, u.defaultPin),
      acct: String((match && match.acct) || "").slice(0, 40),
      phone: String((match && match.phone) || "").slice(0, 25),
      ...(match && match.mustChange ? { mustChange: true } : {})
    };
  });
  const fixedIds = new Set(FIXED_USERS.map(u => u.id));
  const names = new Set(FIXED_USERS.map(u => u.name.toLowerCase()));
  const seen = new Set();
  const extras = [];
  existing.forEach(p => {
    const id = Number(p.id), name = String(p.name || "").trim().slice(0, 30);
    if (!id || fixedIds.has(id) || seen.has(id) || !name || names.has(name.toLowerCase())) return;
    seen.add(id); names.add(name.toLowerCase());
    extras.push({
      id, name,
      color: p.color || PALETTE[(FIXED_USERS.length + extras.length) % PALETTE.length],
      pin: normalizePin(p.pin, "1234"),
      acct: String(p.acct || "").slice(0, 40),
      phone: String(p.phone || "").slice(0, 25),
      ...(p.mustChange ? { mustChange: true } : {})
    });
  });
  return fixed.concat(extras);
}

/* ==========================================================================
   7. BILL SPLITTING & 8% FIXED GST ENGINE
   ========================================================================== */
function blankBill() {
  return {
    title: "",
    date: today(),
    trip: tripFilter === "All" ? "" : tripFilter,
    payerId: currentUserId || (S.people[0] ? S.people[0].id : 1),
    gstEnabled: !!S.settings.defaultGst,
    scAmt: 0,
    scMode: "ord",
    other: 0,
    recTotal: 0,
    items: [],
    settled: {}
  };
}

/* An item in "incl" mode is entered WITH 8% GST already inside the price */
const itemBase = it => it.pm === "incl" ? r2((+it.p || 0) / (1 + GST_RATE / 100)) : (+it.p || 0);

function calcBill(b) {
  const idSet = new Set(S.people.map(p => p.id));
  if (b.payerId) idSet.add(b.payerId);
  (b.items || []).forEach(it => (it.w || []).forEach(pid => idSet.add(pid)));
  const ids = [...idSet];

  const subMap = {}, regMap = {}, gstFix = {};
  ids.forEach(id => { subMap[id] = 0; regMap[id] = 0; gstFix[id] = 0; });

  (b.items || []).forEach(it => {
    const sharers = (it.w || []).filter(id => idSet.has(id));
    const price = +it.p || 0;
    if (sharers.length > 0 && price > 0) {
      const incl = it.pm === "incl";
      const base = itemBase(it);
      sharers.forEach(id => { subMap[id] += base / sharers.length; });
      if (incl) {
        const g = r2(price - base) / sharers.length;
        sharers.forEach(id => { gstFix[id] += g; });
      } else {
        sharers.forEach(id => { regMap[id] += base / sharers.length; });
      }
    }
  });

  const activeIds = ids.filter(id => subMap[id] > 0);
  const totalSubRaw = sum(Object.values(subMap));
  const extraPool = r2((+b.scAmt || 0) + (+b.other || 0));
  const useProp = b.scMode === "prop" && totalSubRaw > 0;
  const gstRaw = ids.map(id => (b.gstEnabled ? regMap[id] * GST_RATE / 100 : 0) + gstFix[id]);
  const extRaw = ids.map(id => extraPool !== 0 && activeIds.length
    ? (useProp ? extraPool * subMap[id] / totalSubRaw : (subMap[id] > 0 ? extraPool / activeIds.length : 0)) : 0);
  /* Round each PERSON'S TOTAL once (equal shares stay equal), then split that total into sub / GST / extra */
  const totRaw = ids.map((id, i) => (subMap[id] || 0) + gstRaw[i] + extRaw[i]);
  const totA = alloc(totRaw, r2(sum(totRaw)));
  const rc = x => Math.sign(x) * Math.round(Math.abs(x) * 100 + 1e-6) / 100;
  const rows = ids.map((id, i) => {
    const g = rc(gstRaw[i]), e = rc(extRaw[i]);
    return { personId: id, person: getPerson(id), sub: r2(totA[i] - g - e), gst: g, extra: e, tot: totA[i] };
  });
  return {
    rows,
    totalSub: r2(sum(rows.map(r => r.sub))),
    totalGst: r2(sum(rows.map(r => r.gst))),
    totalExtra: r2(sum(rows.map(r => r.extra))),
    grandTotal: r2(sum(rows.map(r => r.tot)))
  };
}

/* Round to cents so the parts always add up exactly to the target (largest remainder) */
function alloc(vals, target) {
  const c = vals.map(v => Math.floor(v * 100 + 1e-7));
  let rem = Math.round(target * 100) - sum(c);
  const fr = vals.map((v, i) => [v * 100 - c[i], i]);
  fr.slice().sort((x, y) => y[0] - x[0]).forEach(([q, i]) => { if (rem > 0 && q > 1e-7) { c[i]++; rem--; } });
  fr.slice().sort((x, y) => x[0] - y[0]).forEach(([q, i]) => { if (rem < 0 && c[i] > 0) { c[i]--; rem++; } });
  return c.map(x => x / 100);
}

function getBillDues(bill) {
  const c = calcBill(bill);
  const settled = bill.settled || {};
  return c.rows
    .filter(r => r.personId !== bill.payerId && r2(r.tot) >= 0.01)
    .map(r => ({
      bill,
      fromId: r.personId,
      toId: bill.payerId,
      amount: r2(r.tot),
      isSettled: !!settled[r.personId]
    }));
}

function computeAllBalances() {
  const filteredBills = liveBills().filter(b => tripFilter === "All" || (b.trip || "") === tripFilter);
  const unsettledRows = [];
  const pairMap = {};

  filteredBills.forEach(b => {
    getBillDues(b).forEach(d => {
      if (!d.isSettled && d.toId) {
        unsettledRows.push(d);
        const key = `${d.fromId}->${d.toId}`;
        if (!pairMap[key]) pairMap[key] = { fromId: d.fromId, toId: d.toId, total: 0, items: [] };
        pairMap[key].total = r2(pairMap[key].total + d.amount);
        pairMap[key].items.push(d);
      }
    });
  });

  const pairs = Object.values(pairMap).sort((a, b) => b.total - a.total);
  const totalUnsettled = r2(sum(pairs.map(p => p.total)));
  const totalSpend = r2(sum(filteredBills.map(b => calcBill(b).grandTotal)));

  return { filteredBills, unsettledRows, pairs, totalUnsettled, totalSpend };
}

window.toggleBillPersonSettled = function(billId, personId) {
  const b = S.bills.find(x => x.id === billId);
  if (!b) return;
  b.settled = b.settled || {};
  if (b.settled[personId]) delete b.settled[personId];
  else b.settled[personId] = true;
  saveState();
  render();
};

window.settlePairAll = async function(fromId, toId) {
  if (toId !== currentUserId) return;
  const fromP = getPerson(fromId);
  const free = pairDues(fromId, toId).filter(d => !payOf(d.bill.id, fromId));
  if (!free.length) return showNotice("These bills already have a payment waiting for your confirmation. Open it from the notification above.", "Nothing to mark");
  const ok = await showConfirm(`Mark ${f(sum(free.map(d => d.amount)))} from ${fromP.name} as received (no slip)?`, "Mark received", "Mark received", false);
  if (!ok) return;
  free.forEach(d => { const b = S.bills.find(x => x.id === d.bill.id); if (b) { b.settled = b.settled || {}; b.settled[fromId] = true; } });
  logAct(`Marked Rf ${f(sum(free.map(d => d.amount)))} from ${fromP.name} as received`);
  saveState();
  render();
  pushNotify([fromId], "Marked as received ✓", `${getPerson(currentUserId).name} marked Rf ${f(sum(free.map(d => d.amount)))} from you as received.`);
};

function dueStatus(d) {
  if (d.isSettled) return ["ok", "Settled ✓"];
  if (payOf(d.bill.id, d.fromId)) return ["pe", d.toId === currentUserId ? "Awaiting your confirmation" : "Awaiting confirmation"];
  const rej = S.payments.some(x => x.status === "rejected" && x.fromId === d.fromId && x.billIds.includes(d.bill.id) && !x.ack);
  return ["no", rej ? "Payment rejected" : "Unpaid"];
}

function dueRow(d, who, mine) {
  const st = dueStatus(d);
  const canPay = mine && !d.isSettled && !payOf(d.bill.id, d.fromId);
  const click = canPay ? `openPay(${d.toId},${d.bill.id})` : `openBill(${d.bill.id},'dash')`;
  return `<div class="li" onclick="${click}" style="cursor:pointer">
    <span><b>${esc(d.bill.title)}</b><br><small>${shortDate(d.bill.date)} · ${who}</small></span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><b class="${d.isSettled ? "" : "neg"}">${mh(d.amount)}</b><span class="bd ${st[0]}">${st[1]}</span></span>
  </div>`;
}

}

  return h;

  </div>`;

  h += `<div class="sh">Receipt photo (optional)</div>
  <div class="l"><div class="li col">${D.receiptData
    ? `<img alt="Receipt" src="${D.receiptData}" style="width:100%;border-radius:10px;display:block"><button type="button" class="pill r" style="margin-top:8px" onclick="D.receiptData=null;render()">Remove photo</button>`
    : (D.hasReceipt && !D.receiptRemove)
      ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>Receipt attached ✓</span><span style="display:flex;gap:6px"><label class="pill" style="margin:0">Replace<input type="file" accept="image/*" style="display:none" onchange="pickReceipt(this)"></label><button type="button" class="pill r" onclick="D.receiptRemove=true;render()">Remove</button></span></div>`
      : `<label class="btn sec" style="margin:0">📎 Attach receipt photo<input type="file" accept="image/*" style="display:none" onchange="pickReceipt(this)"></label>`}
    <div class="mu" style="font-size:12px;margin-top:8px">Deleted automatically 2 days after the bill is fully settled.</div></div></div>

  <div class="sh">Per-Person Breakdown</div>
  <div class="l" id="pv"></div>`;

  h += `<div style="margin-top:16px">
    <button class="btn" onclick="saveCurrentBill()">${D.editId ? "Save Changes" : "Save Bill"}</button>
    ${D.editId ? `<button class="btn sec" style="margin-top:8px" onclick="cancelEdit()">Cancel Edit</button>` : ""}
  </div>`;

  return h;
}

window.renderPreview = function() {
  const pv = document.getElementById("pv");
  if (!pv || !D) return;
  const c = calcBill(D);
  const activeRows = c.rows.filter(r => r.tot > 0 || r.sub > 0);

  let html = `<div class="li"><span>Items subtotal</span><b>${mh(c.totalSub)}</b></div>`;
  html += `<div class="li">
    <span>8% Fixed GST ${D.gstEnabled ? '<span class="bd ok" style="margin-left:4px">ON</span>' : '<span class="bd" style="margin-left:4px">OFF</span>'}</span>
    <b>${(D.gstEnabled || c.totalGst > 0) ? mh(c.totalGst) : "Off"}</b>
  </div>`;
  if (c.totalExtra !== 0) {
    html += `<div class="li"><span>Service / Other charges</span><b>${mh(c.totalExtra)}</b></div>`;
  }

  if (activeRows.length === 0) {
    html += `<div class="li mu">Add items and assign people to see each person's share and 8% GST.</div>`;
  } else {
    html += activeRows.map(r => `
      <div class="li">
        <span style="display:flex;gap:10px;align-items:center">
          <span class="dot" style="--c:${r.person.color}">${esc(initials(r.person.name))}</span>
          <span>
            <b>${esc(r.person.name)}</b>${r.personId === D.payerId ? '<span class="cp">payer</span>' : ""}<br>
            <small>Items ${f(r.sub)}${(D.gstEnabled || r.gst > 0.004) ? ` + 8% GST ${f(r.gst)}` : ""}${Math.abs(r.extra) > 0.004 ? ` + Extra ${f(r.extra)}` : ""}</small>
          </span>
        </span>
        <b>${mh(r.tot)}</b>
      </div>
    `).join("");
  }

  html += `<div class="li"><b>Grand Total</b><b style="font-size:19px">${mh(c.grandTotal)}</b></div>`;

  const rec = +D.recTotal || 0;
  if (rec > 0) {
    const diff = c.grandTotal - rec;
    html += Math.abs(diff) <= 0.015
      ? `<div class="li"><span>Receipt check</span><b class="pos">Matches receipt ✓</b></div>`
      : `<div class="li"><span>Receipt total (${f(rec)})</span><b class="neg">${diff > 0 ? "+" : "−"}${f(Math.abs(diff))} difference</b></div>
         <div class="li"><span class="mu">The receipt may round or tax differently. Add the difference to Other charges so totals match.</span><button type="button" class="pill solid" onclick="matchReceipt()">Match receipt</button></div>`;
  }

  pv.innerHTML = html;
};

window.pickReceipt = function(inp) {
  const file = inp.files && inp.files[0];
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    D.receiptData = c.toDataURL("image/jpeg", 0.7); D.receiptRemove = false; render();
  };
  img.onerror = () => showNotice("Could not read that image. Please try another photo.", "Receipt error");
  img.src = url;
};

window.saveCurrentBill = async function() {
  if (!D.payerId) return showNotice("Select who paid the bill.");
  if (!D.items.some(i => +i.p > 0)) return showNotice("Add at least one item with a price.");
  if (D.items.some(i => +i.p > 0 && !(i.w && i.w.length))) return showNotice("Select at least one person for every item.");

  const editId = D.editId;
  const bill = {
    id: editId || nextId(S.bills),
    title: (D.title || "").trim() || "Untitled bill",
    date: D.date || today(),
    trip: (D.trip || "").trim(),
    payerId: D.payerId,
    gstEnabled: !!D.gstEnabled,
    scAmt: +D.scAmt || 0,
    scMode: D.scMode || "ord",
    other: +D.other || 0,
    recTotal: +D.recTotal || 0,
    items: cl(D.items),
    settled: D.settled ? cl(D.settled) : {}
  };
  const oldB = editId ? S.bills.find(b => b.id === editId) : null;
  if (oldB && oldB.editReq) return showNotice("An edit for this bill is already waiting for admin approval.", "Edit pending");
  if (oldB) ["remindSent", "hasReceipt", "receiptDoneAt", "receiptDeleted"].forEach(k => { if (oldB[k] !== undefined) bill[k] = oldB[k]; });
  if (D.receiptData) {
    try { await set(ref(db, "splitmate/receipts/" + bill.id), D.receiptData); }
    catch (e) { return showNotice("Could not upload the receipt: " + e.message, "Upload failed"); }
    bill.hasReceipt = true; delete bill.receiptDoneAt; delete bill.receiptDeleted;
  } else if (D.receiptRemove && bill.hasReceipt) {
    set(ref(db, "splitmate/receipts/" + bill.id), null).catch(() => {});
    bill.hasReceipt = false; delete bill.receiptDoneAt;
  }

  if (editId) {
    if (!oldB) return;
    ["hasReceipt", "receiptDoneAt", "receiptDeleted"].forEach(k => { if (bill[k] !== undefined) oldB[k] = bill[k]; else delete oldB[k]; });
    oldB.editReq = { by: currentUserId, at: Date.now(), data: cl(bill) };
    logAct(`Requested edit of bill "${bill.title}"`);
  } else {
    S.bills.unshift(bill);
    logAct(`Added bill "${bill.title}" (Rf ${f(calcBill(bill).grandTotal)})`);
  }
  saveState();
  if (editId) pushNotify([ADMIN_ID], "Bill edit request", `${getPerson(currentUserId).name} edited "${bill.title}" and needs your approval.`, "editreq-" + editId);
  if (!editId) {
    const payerName = getPerson(bill.payerId).name;
    getBillDues(bill).forEach(d => pushNotify([d.fromId], "New bill: " + bill.title, `You owe Rf ${f(d.amount)} to ${payerName}.`, "bill-" + bill.id));
  }
  D = blankBill();
  window.D = D;
  if (editId) {
    tab = "hist";
    openBillId = bill.id;
    showNotice("Your changes were sent to the admin for approval. The bill stays as it is until then.", "Edit sent");
  } else {
    tab = "dash";
  }
  render();
  scrollTopMain();
};

window.openItemSheet = function(idx) {
  const it = idx >= 0 ? D.items[idx] : null;
  const pm = it && it.pm ? it.pm : "bill";
  const q = it ? (it.q || 1) : 1;
  const defaultSharers = it ? [...it.w] : [];

  sheet = {
    t: "item",
    k: idx,
    n: it ? it.n : "",
    pm,
    pr: it ? String(r2(pm === "unit" ? (+it.p || 0) / q : (+it.p || 0))) : "",
    q,
    w: defaultSharers
  };
  window.sheet = sheet;
  render();
  if (idx < 0) {
    setTimeout(() => {
      const inp = document.getElementById("isn");
      if (inp) inp.focus();
    }, 80);
  }
};

const sheetItemTotal = () => r2((+sheet.pr || 0) * (sheet.pm === "unit" ? sheet.q : 1));

window.updateItemSuggestions = function() {
  const q = (sheet.n || "").trim().toLowerCase(), box = document.getElementById("its");
  if (!box) return;
  itMatches = q ? pastItems().filter(x => x.n.toLowerCase().includes(q) && x.n.toLowerCase() !== q).slice(0, 20) : [];
  box.style.display = itMatches.length ? "block" : "none";
  box.innerHTML = itMatches.map((x, i) => `<div class="li" onclick="pickPastItem(${i})" style="cursor:pointer;min-height:44px"><span>${esc(x.n)}</span><span class="mu">${mh(x.p)}</span></div>`).join("");
};

window.pickPastItem = function(i) {
  const x = itMatches[i];
  if (!x) return;
  sheet.n = x.n;
  sheet.pm = x.pm || "bill";
  sheet.pr = String(x.p);
  sheet.q = 1;
  render();
};

window.toggleSheetPerson = function(id) {
  const idx = sheet.w.indexOf(id);
  if (idx < 0) sheet.w.push(id);
  else sheet.w.splice(idx, 1);
  render();
};

function itemSheetLiveText() {
  const tot = sheetItemTotal(), q = sheet.q;
  const incl = sheet.pm === "incl";
  const gstOn = !!D.gstEnabled;
  const base = incl ? r2(tot / (1 + GST_RATE / 100)) : tot;
  const gstT = incl ? r2(tot - base) : (gstOn ? r2(tot * GST_RATE / 100) : 0);
  const showGst = incl || gstOn;
  const der = sheet.pm === "unit"
    ? (tot > 0 ? `Bill price: <b>${mh(tot)}</b>` : "Bill price = unit price × quantity")
    : incl
    ? (tot > 0 ? `Price <b>${mh(tot)}</b> = ${mh(base)} + ${GST_RATE}% GST <b>${mh(gstT)}</b> (already included, not added again)${q > 1 ? ` · ${mh(tot / q)} each` : ""}` : `Enter the price including ${GST_RATE}% GST, as printed on the receipt`)
    : (q > 1 && tot > 0 ? `Unit price: <b>${mh(tot / q)}</b>` : "Enter total item price from receipt");

  const n = sheet.w.length;
  const gRawT = incl ? r2(tot - base) : (gstOn ? base * GST_RATE / 100 : 0);
  const totA = n ? alloc(Array(n).fill((base + gRawT) / n), r2(base + gRawT)) : [];
  const gstA = totA.map(() => Math.round(gRawT / n * 100 + 1e-6) / 100);
  const baseA = totA.map((v, i) => r2(v - gstA[i]));
  const shares = n === 0
    ? '<div class="li mu">Select who shared this item to preview split.</div>'
    : sheet.w.map((id, i) => `<div class="li">
          <span>${esc(getPerson(id).name)}${showGst && tot > 0 ? `<br><small>Item ${f(baseA[i])} + ${GST_RATE}% GST ${f(gstA[i])}</small>` : ""}</span>
          <b>${mh(totA[i])}</b>
        </div>`).join("") + `<div class="li"><b>Item Total${showGst ? ` (incl. ${GST_RATE}% GST)` : ""}</b><b>${mh(r2(base + gRawT))}</b></div>`;

  return { der, shares };
}

window.updateItemSheetPreview = function() {
  const { der, shares } = itemSheetLiveText();
  const a = document.getElementById("itd"), b = document.getElementById("itp");
  if (a) a.innerHTML = der;
  if (b) b.innerHTML = shares;
};

window.saveSheetItem = function(addAnother) {
  const total = sheetItemTotal();
  if (!(total > 0)) return showNotice("Enter a valid price greater than 0.");
  if (!sheet.w.length) return showNotice("Select at least one person who shared this item.");

  const item = {
    n: (sheet.n || "").trim() || "Item",
    p: total,
    q: sheet.q,
    pm: sheet.pm,
    w: [...sheet.w]
  };

  if (sheet.k < 0) D.items.push(item);
  else D.items[sheet.k] = item;

  if (addAnother) {
    sheet = { t: "item", k: -1, n: "", pm: sheet.pm, pr: "", q: 1, w: [] };
    window.sheet = sheet;
    render();
    setTimeout(() => {
      const inp = document.getElementById("isn");
      if (inp) inp.focus();
    }, 80);
  } else {
    sheet = null;
    window.sheet = null;
    render();
  }
};

window.deleteSheetItem = function() {
  if (sheet && sheet.k >= 0) D.items.splice(sheet.k, 1);
  sheet = null;
  window.sheet = null;
  render();
};

function billStatus(b) {
  const d = getBillDues(b);
  const pending = d.filter(x => !x.isSettled);
  if (d.length === 0 || pending.length === 0) return { label: "Settled", cls: "ok", sub: "" };
  return {
    label: `${pending.length} pending`,
    cls: "no",
    sub: pending.map(x => `${getPerson(x.fromId).name} owes ${mh(x.amount)}`).join(" · ")
  };
}

function viewHistory() {
  if (openBillId !== null) return viewBillDetail(openBillId);

  let h = headB('style="margin-top:6px" onclick="go(\'dash\')"', "‹ Overview", "Bills", `${liveBills().length} saved bill${liveBills().length === 1 ? "" : "s"}`);
  h += `<div class="l"><div class="li"><input type="search" placeholder="Search place, trip, item or person" value="${esc(histQuery)}" oninput="histQuery=this.value;document.getElementById('hl').innerHTML=renderHistoryList()" style="text-align:left"></div></div>`;
  h += `<div id="hl">${renderHistoryList()}</div>`;
  return h;
}

window.renderHistoryList = function() {
  const q = histQuery.trim().toLowerCase();
  const filtered = q
    ? liveBills().filter(b => [
        b.title, b.trip, getPerson(b.payerId).name,
        ...(b.items || []).map(i => i.n)
      ].join(" ").toLowerCase().includes(q))
    : liveBills();

  if (!filtered.length) {
    return `<div class="l" style="margin-top:14px"><div class="li mu">${q ? "No matching bills found." : "No bills saved yet. Create one from the Overview."}</div></div>`;
  }

  let h = "";
  const tripTotals = {};
  liveBills().forEach(b => {
    const k = b.trip || "General";
    tripTotals[k] = (tripTotals[k] || 0) + calcBill(b).grandTotal;
  });
  if (!q && Object.keys(tripTotals).length > 1) {
    h += `<div class="sh">Totals by Trip</div><div class="l">${Object.entries(tripTotals).map(([k, v]) => `<div class="li"><span>${esc(k)}</span><b>${mh(v)}</b></div>`).join("")}</div>`;

  });

  h += Object.keys(byDate).sort().reverse().map(d => {

          <div style="flex:1;min-width:0">
            <b>${esc(b.title)}</b>${b.trip ? `<span class="cp">${esc(b.trip)}</span>` : ""}${b.gstEnabled ? `<span class="cp">8% GST</span>` : ""}
            <div class="mu">${shortDate(d)} · paid by ${esc(payer.name)}</div>
          </div>
          <div style="text-align:right;flex:none">
            <b>${mh(c.grandTotal)}</b><br>

        </div>

  return h;

function viewBillDetail(id) {
  const b = S.bills.find(x => x.id === id);
  if (!b || (b.delReq && !isAdmin())) { openBillId = null; return viewHistory(); }

  const c = calcBill(b);
  const payer = getPerson(b.payerId);
  const activeRows = c.rows.filter(r => r.tot > 0.004);
  const dues = getBillDues(b);

  let h = headB(
    'style="margin-top:6px" onclick="closeBill()"',
    billFrom ? "‹ Back" : "‹ Bills",
    esc(b.title),
    `${shortDate(b.date)} · Paid by ${esc(payer.name)}${b.trip ? " · " + esc(b.trip) : ""}`
  );

  h += `<div class="l">
    <div class="li"><span>Items subtotal</span><b>${mh(c.totalSub)}</b></div>
    <div class="li"><span>8% Fixed GST</span><b>${(b.gstEnabled || c.totalGst > 0) ? mh(c.totalGst) : "Disabled"}</b></div>
    ${+b.scAmt !== 0 ? `<div class="li"><span>Service charge</span><b>${mh(+b.scAmt)}</b></div>` : ""}

  </div>`;

  h += `<div class="sh">Per-Person Breakdown</div>
  <div class="l">${activeRows.map(r => `
    <div class="li">
      <span style="display:flex;gap:10px;align-items:center">
        <span class="dot" style="--c:${r.person.color}">${esc(initials(r.person.name))}</span>
        <span>
          <b>${esc(r.person.name)}</b>${r.personId === b.payerId ? '<span class="cp">paid bill</span>' : ""}<br>
          <small>Items ${f(r.sub)}${(b.gstEnabled || r.gst > 0.004) ? ` + 8% GST ${f(r.gst)}` : ""}${Math.abs(r.extra) > 0.004 ? ` + Extra ${f(r.extra)}` : ""}</small>
        </span>
      </span>
      <b>${mh(r.tot)}</b>
    </div>
  `).join("")}</div>`;

  if (dues.length > 0) {
    const me = currentUserId;
    h += `<div class="sh">Settlement Status (Owed to ${esc(payer.name)})</div>
    <div class="l">${dues.map(d => {
      const p = getPerson(d.fromId), pend = payOf(b.id, d.fromId);
      const rej = !d.isSettled && !pend && S.payments.some(x => x.status === "rejected" && x.fromId === d.fromId && x.billIds.includes(b.id) && !x.ack);
      let act;
      if (d.isSettled) {
        const cp = S.payments.find(x => x.status === "confirmed" && x.fromId === d.fromId && x.billIds.includes(b.id));
        const slipBtn = cp ? `<button class="pill" onclick="openPayment(${cp.id})">View details</button>` : "";
        act = `<span style="display:flex;gap:6px;align-items:center">${slipBtn}${me === b.payerId ? `<button class="pill g" onclick="undoSettled(${b.id},${d.fromId})">Settled ✓</button>` : `<span class="bd ok">Settled ✓</span>`}</span>`;
      }
      else if (pend) act = `<button class="pill" onclick="openPayment(${pend.id})">${me === b.payerId ? "Review &amp; confirm" : "Awaiting confirmation"}</button>`;
      else if (me === d.fromId) act = `<button class="pill solid" onclick="openPay(${b.payerId},${b.id})">Pay &amp; attach slip</button>`;

      <b>${mh(+it.p || 0)}</b>
    </div>`;
  }).join("")}</div>`;

  h += `<div class="row2" style="margin-top:18px">
    <button class="btn sec" onclick="useBillAsTemplate(${b.id})">Use as Template</button>
    <button class="btn sec" onclick="editSavedBill(${b.id})">Edit Bill</button>

  return h;
}

/* Remove a bill completely: the bill, its share inside any payments, and orphaned payments + slips */
async function purgeBill(id) {
  const b = S.bills.find(x => x.id === id);
  if (!b) return;
  const dues = getBillDues(b);
  logAct(`Deleted bill "${b.title}"`);
  if (b.hasReceipt) set(ref(db, "splitmate/receipts/" + id), null).catch(() => {});
  const gone = [];
  S.payments.forEach(p => {
    if (!p.billIds.includes(id)) return;
    const d = dues.find(x => x.fromId === p.fromId);
    p.billIds = p.billIds.filter(x => x !== id);
    if (!p.billIds.length) gone.push(p); else p.amount = r2(Math.max(0, p.amount - (d ? d.amount : 0)));
  });
  await Promise.all(gone.map(p => p.hasSlip ? set(ref(db, "splitmate/slips/" + p.id), null).catch(() => {}) : null));
  const goneIds = new Set(gone.map(p => p.id));
  S.payments = S.payments.filter(p => !goneIds.has(p.id));
  S.bills = S.bills.filter(x => x.id !== id);
  saveState();
}

window.pickSlip = function(inp) {
  const file = inp.files && inp.files[0];
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    if (sheet && sheet.t === "pay") { sheet.slip = c.toDataURL("image/jpeg", 0.7); render(); }
  };
  img.onerror = () => showNotice("Could not read that image. Please try another photo.", "Slip error");
  img.src = url;
};

const fq = q => String(r2(q));
function userShare(b, uid) {
  const r = calcBill(b).rows.find(x => x.personId === uid);
  if (!r || r.tot <= 0) return null;
  const its = (b.items || []).filter(it => (it.w || []).includes(uid) && +it.p > 0);
  const sh = alloc(its.map(it => itemBase(it) / it.w.length), r.sub);
  const gRaw = its.map((it, i) => it.pm === "incl" ? r2((+it.p || 0) - itemBase(it)) / it.w.length : (b.gstEnabled ? sh[i] * GST_RATE / 100 : 0));
  const gA = alloc(gRaw, r.gst);
  const lines = its.map((it, i) => ({ n: it.n || "Item", q: (+it.q || 1) / it.w.length, shared: it.w.length, amt: sh[i], gst: gA[i], tot: r2(sh[i] + gA[i]), unit: itemBase(it) / (+it.q || 1), inc: it.pm === "incl" }));
  return { lines, qty: r2(sum(lines.map(l => l.q))), sub: r.sub, gst: r.gst, extra: r.extra, tot: r.tot, gstOn: !!b.gstEnabled };
}
const shLn = (l, v, bold) => `<div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0;${bold ? "font-weight:700;border-top:.5px solid var(--bd);margin-top:4px;padding-top:6px" : ""}"><span>${l}</span><span>${v}</span></div>`;

  if (!u) return "";
  return `<div style="margin-top:10px;padding-top:8px;border-top:.5px solid var(--bd)">
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px">

      <tbody>${u.lines.map(l => `<tr style="text-align:right;border-top:.5px solid var(--bd)"><td style="text-align:left;padding:5px 4px 5px 0">${esc(l.n)}${l.shared > 1 ? `<br><small class="mu">shared by ${l.shared}</small>` : ""}</td><td style="padding:5px 4px">${fq(l.q)}</td><td style="padding:5px 4px">${f(l.unit)}</td><td style="padding:5px 4px">${f(l.gst)}</td><td style="padding:5px 0 5px 4px"><b>${f(l.tot)}</b></td></tr>`).join("")}</tbody>
    </table></div><div class="mu" style="font-size:11px;margin:2px 0 4px">Unit price is before GST</div>
    ${shLn("Qty consumed", fq(u.qty), true)}
    ${shLn("Items subtotal", f(u.sub))}

    ${Math.abs(u.extra) > 0.004 ? shLn("Service / other share", f(u.extra)) : ""}
    ${shLn("Total", f(u.tot), true)}
  </div>`;
}

window.submitPay = async function() {
  const s = sheet, me = currentUserId;

  if (!dues.length) return showNotice("Select at least one bill to pay.");
  if (s.method !== "cash" && !s.slip) return showNotice("Attach your payment slip to continue.", "Slip required");
  const id = nextId(S.payments), amount = r2(sum(dues.map(d => d.amount))), toName = getPerson(s.toId).name;
  s.busy = true; render();
  if (s.slip) {
    try { await set(ref(db, "splitmate/slips/" + id), s.slip); }
    catch (e) { s.busy = false; render(); return showNotice("Could not upload the slip: " + e.message, "Upload failed"); }
  }
  S.payments.unshift({ id, fromId: me, toId: s.toId, billIds: dues.map(d => d.bill.id), amount, method: METHODS[s.method], note: (s.note || "").trim(), hasSlip: !!s.slip, status: "pending", at: Date.now() });

const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64uToBytes = str => {
  const b = (str + "=".repeat((4 - str.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(b), c => c.charCodeAt(0));
};

async function pushPost(path, body) {
  const r = await fetch(PUSH_API.replace(/\/$/, "") + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("Server said " + r.status);

}

  const me = getPerson(currentUserId);
  await pushPost("/subscribe", { userId: me.id, pin: me.pin, subscription: sub.toJSON() });
}

async function pushUnregisterCurrent() {
  try {
    if (!pushConfigured() || !pushSupported() || currentUserId === null) return;
    const me = getPerson(currentUserId);
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) await pushPost("/unsubscribe", { userId: me.id, pin: me.pin, endpoint: sub.endpoint });
  } catch (e) {}
}

async function refreshPushState() {
  if (!pushConfigured()) pushState = "unconfigured";
  else if (isIOS && !isStandalone()) pushState = "needsInstall";
  else if (!pushSupported()) pushState = "unsupported";
  else if (Notification.permission === "denied") pushState = "denied";
  else {
    let sub = null;
    try { const reg = await navigator.serviceWorker.getRegistration(); sub = reg && await reg.pushManager.getSubscription(); } catch (e) {}
    pushState = sub && Notification.permission === "granted" && pushFlag() ? "on" : "off";
  }
}

window.enablePush = async function() {
  if (!["off", "denied"].includes(pushState)) return;
  pushState = "busy"; render();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { await refreshPushState(); render(); return; }
    await pushRegister();
    setPushFlag(true);
    await refreshPushState(); render();
    showNotice("Notifications are on for this device. You'll be alerted about new bills and payments.", "Notifications on");
  } catch (e) {
    await refreshPushState(); render();
    showNotice("Could not turn on notifications: " + e.message, "Notifications");
  }
};

window.disablePush = async function() {
  pushState = "busy"; render();
  try {
    await pushUnregisterCurrent();
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch (e) {}
  setPushFlag(false);
  await refreshPushState(); render();
};

function pushNotify(toIds, title, body, tag, selfToo) {
  try {
    if (!pushConfigured() || currentUserId === null) return;
    const ids = [...new Set(toIds)].filter(id => id && (selfToo || id !== currentUserId));
    if (!ids.length) return;
    const me = getPerson(currentUserId);
    pushPost("/notify", { fromId: me.id, pin: me.pin, toIds: ids, title, body, tag: tag || undefined }).catch(() => {});
  } catch (e) {}
}

window.testPush = function() {
  pushNotify([currentUserId], "SplitMate test", "Notifications are working on this device 🎉", "test", true);
};

function pushSection() {
  const st = pushState;
  const sub = {
    checking: "Checking…",
    unconfigured: "Not set up yet",
    needsInstall: "On iPhone, add SplitMate to your Home Screen first, then open it from there",
    unsupported: "This browser doesn't support push notifications",
    denied: "Blocked. Allow notifications for SplitMate in your phone settings, then tap Retry",
    off: "Get alerted about new bills and payments",
    on: "On for this device",
    busy: "Working…"
  }[st] || "";
  const act = st === "off" ? `<button class="pill solid" onclick="enablePush()">Turn on</button>`
    : st === "denied" ? `<button class="pill" onclick="enablePush()">Retry</button>`
    : st === "on" ? `<span style="display:flex;gap:6px"><button class="pill" onclick="testPush()">Test</button><button class="pill r" onclick="disablePush()">Turn off</button></span>`
    : "";
  return `<div class="sh">Notifications</div>
  <div class="l"><div class="li"><span><b>Phone notifications</b><br><small>${sub}</small></span>${act}</div></div>`;
}

/* ---- manual reminders (payer -> unpaid people) ---- */
const REMIND_MAX = 2;
const remindsLeft = b => REMIND_MAX - ((b.remindSent && b.remindSent.d === today()) ? (b.remindSent.n || 0) : 0);
let sweeping = false;
function sweepSlips() {
  if (!loaded || sweeping) return;
  const now = Date.now(), cut = now - 2 * 864e5;
  let changed = false;
  S.log = S.log || [];
  if (S.log.some(e => (e.at || 0) < cut)) { S.log = S.log.filter(e => (e.at || 0) >= cut); changed = true; }
  const old = S.payments.filter(p => (p.decidedAt || p.at || 0) < cut && ((p.status === "confirmed" && !p.completed) || (p.status === "rejected" && p.hasSlip)));
  const rcDel = [];
  S.bills.forEach(b => {
    if (!b.hasReceipt) return;
    if (!getBillDues(b).every(d => d.isSettled)) { if (b.receiptDoneAt) { delete b.receiptDoneAt; changed = true; } return; }
    if (!b.receiptDoneAt) { b.receiptDoneAt = now; changed = true; }
    else if (b.receiptDoneAt < cut) rcDel.push(b);
  });
  if (!old.length && !rcDel.length && !changed) return;
  sweeping = true;
  Promise.all([
    ...old.map(p => p.hasSlip ? set(ref(db, "splitmate/slips/" + p.id), null).catch(() => {}) : null),
    ...rcDel.map(b => set(ref(db, "splitmate/receipts/" + b.id), null).catch(() => {}))
  ]).then(() => {
    old.forEach(o => {
      const p = payById(o.id);
      if (!p) return;
      if (p.hasSlip) p.slipDeleted = true;
      p.hasSlip = false;
      if (p.status === "confirmed") p.completed = true;
    });
    rcDel.forEach(o => { const b = S.bills.find(x => x.id === o.id); if (b) { b.hasReceipt = false; b.receiptDeleted = true; delete b.receiptDoneAt; } });
    saveState(); sweeping = false;
  });
}
window.remindNow = function(id) {
  const b = S.bills.find(x => x.id === id);
  if (!b || b.payerId !== currentUserId) return;
  const open = getBillDues(b).filter(d => !d.isSettled && !payOf(id, d.fromId));
  if (!open.length) return showNotice("Everyone has either paid or has a payment waiting for you to confirm.", "Nothing to remind");
  if (remindsLeft(b) <= 0) return showNotice("You've already sent 2 reminders for this bill today. You can send more tomorrow.", "Daily limit reached");
  b.remindSent = { d: today(), n: REMIND_MAX - remindsLeft(b) + 1 };
  logAct(`Sent payment reminder for "${b.title}"`);
  saveState();
  open.forEach(d => pushNotify([d.fromId], "Payment reminder", `You owe Rf ${f(d.amount)} to ${getPerson(b.payerId).name} for "${b.title}".`, "remind-" + id + "-" + d.fromId));
  showNotice("Reminder sent to " + open.map(d => getPerson(d.fromId).name).join(", ") + `. ${remindsLeft(b)} left today.`, "Reminder sent");
  render();
};

/* ---- own spending by month + heat map ---- */
let spendMonth = null, spendDay = null;
const mKey = d => String(d || "").slice(0, 7);
const p2 = n => String(n).padStart(2, "0");
const mLabel = k => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 1).toLocaleString("en", { month: "short", year: "numeric" });
window.setSpendMonth = k => { spendMonth = k; spendDay = null; render(); };
window.stepSpendMonth = n => { const [y, m] = spendMonth.split("-").map(Number), d = new Date(y, m - 1 + n, 1); spendMonth = d.getFullYear() + "-" + p2(d.getMonth() + 1); spendDay = null; render(); };
window.setSpendDay = k => { spendDay = spendDay === k ? null : k; render(); };

function spendHtml(uid) {
  const byDay = {}, byMonth = {}, dayBills = {};
  liveBills().filter(b => tripFilter === "All" || (b.trip || "") === tripFilter).forEach(b => {
    const r = calcBill(b).rows.find(x => x.personId === uid), t = r ? r.tot : 0;
    if (!(t > 0) || !b.date) return;
    byDay[b.date] = r2((byDay[b.date] || 0) + t);
    byMonth[mKey(b.date)] = r2((byMonth[mKey(b.date)] || 0) + t);
    (dayBills[b.date] = dayBills[b.date] || []).push({ b, t });
  });
  const nowK = mKey(today());
  if (!spendMonth) spendMonth = nowK;
  const [y, m] = spendMonth.split("-").map(Number);
  const days = new Date(y, m, 0).getDate(), first = new Date(y, m - 1, 1).getDay();
  const vals = [...Array(days)].map((_, i) => byDay[`${spendMonth}-${p2(i + 1)}`] || 0);
  const maxD = Math.max(...vals, 0), tot = r2(sum(vals)), act = vals.filter(v => v > 0).length;
  const pd = new Date(y, m - 2, 1), prevK = pd.getFullYear() + "-" + p2(pd.getMonth() + 1), prevT = byMonth[prevK] || 0;
  let cmp = "";
  if (prevT > 0 || tot > 0) {
    if (prevT <= 0) cmp = `<span class="mu">No spending in ${mLabel(prevK)}</span>`;
    else {
      const dl = r2(tot - prevT), pc = Math.round(Math.abs(dl) / prevT * 100);
      cmp = Math.abs(dl) < 0.005 ? `<span class="mu">Same as ${mLabel(prevK)}</span>`
        : `<span class="${dl > 0 ? "neg" : "pos"}">${dl > 0 ? "▲" : "▼"} ${mh(Math.abs(dl))} (${pc}%)</span> <span class="mu">vs ${mLabel(prevK)}</span>`;
    }
  }
  let cells = ["S", "M", "T", "W", "T", "F", "S"].map(d => `<div class="hd">${d}</div>`).join("") + '<div></div>'.repeat(first);
  vals.forEach((v, i) => {
    const key = `${spendMonth}-${p2(i + 1)}`;
    const hue = Math.round(120 - 120 * (maxD > 0 ? v / maxD : 0));
    const sel = spendDay === key ? "box-shadow:0 0 0 2px var(--tx);" : "";
    cells += `<div class="c" ${v > 0 ? `onclick="setSpendDay('${key}')"` : ""} style="${sel}${v > 0 ? `cursor:pointer;background:hsl(${hue} 65% 46%);color:${hue > 35 && hue < 85 ? "#000" : "#fff"}` : ""}"><b>${i + 1}</b>${v > 0 ? `<i style="font-size:${[13, 13, 13, 13, 13, 13, 11.5, 10.5, 9.5][Math.min(f(v).length, 8)] || 8.5}px">${f(v)}</i>` : ""}</div>`;
  });
  const dl = spendDay && spendDay.startsWith(spendMonth) && dayBills[spendDay] ? dayBills[spendDay] : null;
  const detail = dl ? `<div style="margin-top:12px;border-top:.5px solid var(--bd);padding-top:8px">
    <div style="display:flex;justify-content:space-between"><b>${shortDate(spendDay)}</b><b>${mh(byDay[spendDay])}</b></div>
    ${dl.map(x => `<div onclick="openBill(${x.b.id},'dash')" style="cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px"><span>${esc(x.b.title)} <span class="mu">›</span></span><span>${mh(x.t)}</span></div>`).join("")}
  </div>` : `<div class="mu" style="font-size:12px;margin-top:10px">Tap a day to see its bills.</div>`;
  return `<div class="sh">Your spending${tripFilter !== "All" ? " · " + esc(tripFilter) : ""}</div>
  <div class="l"><div class="li col">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <button class="pill" onclick="stepSpendMonth(-1)">‹</button>
      <span style="text-align:center"><b>${mLabel(spendMonth)}</b><br><small class="mu">${mh(tot)} · ${act} day${act === 1 ? "" : "s"} with spending</small>${cmp ? `<br><small>${cmp}</small>` : ""}</span>
      <button class="pill" onclick="stepSpendMonth(1)">›</button>
    </div>
    <div class="hm">${cells}</div>
    <div class="mu" style="font-size:11px;margin-top:8px;display:flex;align-items:center;gap:6px;justify-content:flex-end">Low <span style="width:90px;height:10px;border-radius:5px;display:inline-block;background:linear-gradient(90deg,hsl(120 65% 46%),hsl(60 65% 46%),hsl(0 65% 46%))"></span> High</div>
    ${detail}
  </div></div>`;
}

function payHistHtml(uid) {
  const ps = S.payments.filter(p => p.fromId === uid || p.toId === uid).sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 10);
  if (!ps.length) return "";
  return `<div class="sh">Payments &amp; slips</div><div class="l">${ps.map(p => {
    const out = p.fromId === uid, o = getPerson(out ? p.toId : p.fromId);
    const st = p.status === "confirmed" ? ["ok", p.completed ? "Completed" : "Confirmed"] : p.status === "rejected" ? ["no", "Rejected"] : ["pe", "Pending"];
    return `<div class="li"><span>${out ? "Paid" : "Received from"} <b>${esc(o.name)}</b><br><small>${shortDate(ldate(new Date(p.at)))} · ${esc(p.method)}${p.hasSlip ? " · slip" : ""}</small></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><b>${mh(p.amount)}</b><span style="display:flex;gap:6px;align-items:center"><span class="bd ${st[0]}">${st[1]}</span><button class="pill" onclick="openPayment(${p.id})">View details</button></span></span></div>`;
  }).join("")}</div>`;
}

/* iPhone Home Screen app: stretch to the physical bottom edge (round corners) when the page reports a shorter height */
const lsRead = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsWrite = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
const numOr = (v, d) => (v !== null && v !== "" && isFinite(+v)) ? +v : d;
let fitMode = ["auto", "off", "manual"].includes(lsRead("splitmate_fitmode")) ? lsRead("splitmate_fitmode") : "auto";
let fitExt = numOr(lsRead("splitmate_fitext"), 34);
let navLift = numOr(lsRead("splitmate_navlift"), 0);
let fitH = 0;
function fitScreen() {
  const b = document.body, de = document.documentElement;
  const off = () => { fitH = 0; b.style.bottom = ""; b.style.height = ""; de.style.removeProperty("--sab"); };
  try {
    de.style.setProperty("--nl", navLift + "px");
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
    if (fitMode === "off" || typing) return off();
    if (fitMode === "manual") {
      fitH = Math.round(innerHeight + fitExt);
      b.style.bottom = "auto"; b.style.height = fitH + "px";
      de.style.setProperty("--sab", fitExt + "px");
      return;
    }
    if (!(/iphone|ipod/i.test(navigator.userAgent) && isStandalone())) return off();
    const portrait = innerWidth < innerHeight;
    const sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    const vv = window.visualViewport ? visualViewport.height + visualViewport.offsetTop : 0;
    const gap = sh - Math.max(innerHeight, vv);
    if (gap <= 0 || gap > 90) return off();
    const pr = document.createElement("div");
    pr.style.cssText = "position:fixed;left:0;bottom:0;visibility:hidden;padding-bottom:env(safe-area-inset-bottom,0px)";
    b.appendChild(pr);
    const safe = parseFloat(getComputedStyle(pr).paddingBottom) || 0;
    pr.remove();
    fitH = sh;
    b.style.bottom = "auto"; b.style.height = sh + "px";
    de.style.setProperty("--sab", Math.max(safe, gap) + "px");
  } catch (e) {}
}
const fitUi = () => { fitScreen(); render(); };
window.setFitMode = k => { if (!["auto", "off", "manual"].includes(k)) return; fitMode = k; lsWrite("splitmate_fitmode", k); fitUi(); };
window.stepFitExt = d => { fitExt = Math.max(0, Math.min(120, fitExt + d)); lsWrite("splitmate_fitext", fitExt); fitUi(); };
window.stepNavLift = d => { navLift = Math.max(-10, Math.min(60, navLift + d)); lsWrite("splitmate_navlift", navLift); fitUi(); };
window.resetFit = () => { fitMode = "auto"; fitExt = 34; navLift = 0; ["splitmate_fitmode", "splitmate_fitext", "splitmate_navlift"].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); fitUi(); };
window.showScreenInfo = function() {
  const m = css => { const d = document.createElement("div"); d.style.cssText = "position:fixed;left:0;top:0;width:1px;visibility:hidden;" + css; document.body.appendChild(d); const h = Math.round(d.getBoundingClientRect().height * 10) / 10; d.remove(); return h; };
  const L = [
    `Standalone: ${isStandalone() ? "yes" : "no"} (iOS: ${isIOS ? "yes" : "no"})`,
    `Window: ${innerWidth} × ${innerHeight}`,
    `Screen: ${screen.width} × ${screen.height}`,
    `Visual viewport height: ${window.visualViewport ? Math.round(visualViewport.height * 10) / 10 : "n/a"}`,
    `100vh: ${m("height:100vh")} · 100dvh: ${m("height:100dvh")}`,
    `100svh: ${m("height:100svh")} · 100lvh: ${m("height:100lvh")}`,
    `Safe top: ${m("height:env(safe-area-inset-top,0px)")} · bottom: ${m("height:env(safe-area-inset-bottom,0px)")}`,
    `Body height: ${Math.round(document.body.getBoundingClientRect().height)} · bottom: ${Math.round(document.body.getBoundingClientRect().bottom)}`,
    `Display size: ${zoomLv}`,
    `App fit (${fitMode}): ${fitH ? "stretched to " + fitH + "px" : "off (normal layout)"} · nav lift ${navLift}px`
  ];
  showNotice(L.join("\n"), "Screen info");
};
window.addEventListener("resize", fitScreen);
window.addEventListener("orientationchange", () => setTimeout(fitScreen, 250));
window.addEventListener("pageshow", fitScreen);
document.addEventListener("visibilitychange", () => { if (!document.hidden) fitScreen(); });
document.addEventListener("focusin", fitScreen);
document.addEventListener("focusout", () => setTimeout(fitScreen, 120));
if (window.visualViewport) visualViewport.addEventListener("resize", fitScreen);
fitScreen(); setTimeout(fitScreen, 300); setTimeout(fitScreen, 1200);

applyTheme();
applyZoom();
D = blankBill();
render();
refreshPushState().then(() => {
  if (pushState === "on" && currentUserId !== null) pushRegister().catch(() => {});
  render();
});
</script>
