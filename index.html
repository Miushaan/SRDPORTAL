.tile{background:var(--card);border-radius:14px;padding:14px}.tile small{color:var(--mu);font-size:13px}.tile b{display:block;font-size:clamp(17px,5.6vw,22px);margin-top:2px;white-space:nowrap}
.bd{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}.bd.ok{background:var(--grn);color:#fff}.bd.no{background:var(--red);color:#fff}
.step{display:flex;align-items:center;gap:14px}.step b{font-size:24px;min-width:30px;text-align:center}.step .pill{min-width:44px;min-height:40px;font-size:20px}
.fp{position:absolute;top:0;left:0;right:0;bottom:0;z-index:60;background:var(--bg);overflow:hidden}

.dd{display:none;position:absolute;left:8px;right:8px;top:100%;z-index:25;background:var(--card);border:.5px solid var(--bd);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.2);max-height:230px;overflow-y:auto;scrollbar-width:none}
.dd::-webkit-scrollbar{display:none}
.gst-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--bd);
  transition:border-color .2s,background .2s;
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ==========================================================================
   1. FIREBASE INITIALIZATION
   ========================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBHlZBWP1wQm_4GXwkc4aW02JSfucEKoTk",
  authDomain: "thila-island-resort-and-spa.firebaseapp.com",
  projectId: "thila-island-resort-and-spa",
  storageBucket: "thila-island-resort-and-spa.firebasestorage.app",
  messagingSenderId: "553790393300",
  appId: "1:553790393300:web:7a943f51b24217a8be2441",
  measurementId: "G-H23W0TDETH",
  databaseURL: "https://thila-island-resort-and-spa-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ==========================================================================
   2. FIXED USERS & PIN AUTHENTICATION
   ========================================================================== */
const PALETTE = [
  "#007aff", "#ff9500", "#34c759", "#af52de", "#ff2d92",
  "#30b0c7", "#ff3b30", "#5856d6", "#00c7be", "#a2845e"
];

const FIXED_USERS = [
  { id: 1, name: "Miu", color: PALETTE[0], defaultPin: "1234" },
  { id: 2, name: "Shaheer", color: PALETTE[1], defaultPin: "1234" },
  { id: 3, name: "Ameer", color: PALETTE[2], defaultPin: "1234" },
  { id: 4, name: "Hammadh", color: PALETTE[3], defaultPin: "1234" },
  { id: 5, name: "Mahil", color: PALETTE[4], defaultPin: "1234" },
  { id: 6, name: "Wisham", color: PALETTE[5], defaultPin: "1234" },
  { id: 7, name: "Prasad", color: PALETTE[6], defaultPin: "1234" },
  { id: 8, name: "Kuday", color: PALETTE[7], defaultPin: "1234" },
  { id: 9, name: "Muneef", color: PALETTE[8], defaultPin: "1234" },
  { id: 10, name: "Alyan", color: PALETTE[9], defaultPin: "1234" }
];

function normalizePin(val, fallback) {
  const s = val !== undefined && val !== null ? String(val).trim() : "";
  return /^\d{4,6}$/.test(s) ? s : fallback;
}

function buildCanonicalPeople(existingPeople) {
  const existing = Array.isArray(existingPeople) ? existingPeople : [];
  return FIXED_USERS.map((u, idx) => {
    const match = existing.find(p => p && (Number(p.id) === u.id || String(p.name || "").trim().toLowerCase() === u.name.toLowerCase()));
    return {
      id: u.id,
      name: u.name,
      color: (match && match.color) || PALETTE[idx % PALETTE.length],
      pin: normalizePin(match && match.pin, u.defaultPin),
      acct: String((match && match.acct) || "").slice(0, 40),
      phone: String((match && match.phone) || "").slice(0, 25)
    };
  });
}

let currentUserId = (() => {
  try { const v = Number(localStorage.getItem("splitmate_user")); return FIXED_USERS.some(u => u.id === v) ? v : null; }
  catch (e) { return null; }
})();
let selectedAuthUserId = FIXED_USERS[0].id;
let authPinInput = "";
let authError = "";
let lastRenderedAuthUserId = null;

/* ==========================================================================
   3. APP STATE & FIREBASE SYNC
   ========================================================================== */
const GST_RATE = 8;

let S = {
  people: buildCanonicalPeople([]),
  bills: [],
  payments: [],
  settings: {
    defaultGst: true,
    theme: "auto"
  }
};

let tab = "dash";
let tripFilter = "All";
let histQuery = "";
let openBillId = null;
let sheet = null;
let D = null;

function applyTheme() {
  const root = document.documentElement;
  if (S.settings.theme === "light" || S.settings.theme === "dark") {
    root.setAttribute("data-theme", S.settings.theme);
  } else {
    root.removeAttribute("data-theme");
  }
}

let loaded = false;
const hideBoot = () => { const b = document.getElementById("boot"); if (b) b.remove(); };

function saveState() {
  if (!loaded) { showNotice("Still connecting to the server. Please try again in a moment.", "Not connected"); return; }
  S.people = buildCanonicalPeople(S.people);
  set(ref(db, "splitmate/state"), S).catch(err => {
    console.error("Firebase sync error:", err);
    showNotice("Could not sync changes to Firebase: " + err.message, "Sync Error");
  });
}

const toArr = v => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);
const stateRef = ref(db, "splitmate/state");
onValue(stateRef, (snap) => {
  const val = snap.val();
  loaded = true;
  if (val && typeof val === "object") {
    const incomingPeople = Array.isArray(val.people) ? val.people : [];
    const canonical = buildCanonicalPeople(incomingPeople);
    const needsSeed = incomingPeople.length !== FIXED_USERS.length ||
      FIXED_USERS.some((u, i) => !incomingPeople[i] || incomingPeople[i].name !== u.name || !/^\d{4,6}$/.test(String(incomingPeople[i].pin || "")));

    S.people = canonical;
    S.bills = toArr(val.bills);
    S.payments = toArr(val.payments);
    S.settings = Object.assign({ defaultGst: true, theme: "auto" }, val.settings || {});
    applyTheme();
    if (!D) D = blankBill();
    if (needsSeed) {
      saveState();
    }
  } else {
    S.people = buildCanonicalPeople([]);
    saveState();
  }
  render({ fromRemote: true });
  hideBoot();
});

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f = n => {
  n = Math.abs(n) < 0.005 ? 0 : +n;
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const r2 = x => Math.round((+x || 0) * 100) / 100;
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const cl = o => JSON.parse(JSON.stringify(o));
const mh = x => `<span class="rf"></span>${f(x)}`;

function ldate(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const today = () => ldate();

const dayLabel = d => {
  const y = new Date();
  y.setDate(y.getDate() - 1);
  if (d === ldate()) return "Today";
  if (d === ldate(y)) return "Yesterday";
  const dt = new Date(d + "T00:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
};

const shortDate = d => {
  const t = new Date(d + "T00:00:00");
  return isNaN(t) ? d : t.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
};

function nextId(list) {
  return Math.max(Date.now(), ...list.map(x => (+x.id || 0) + 1));
}

function getPerson(id) {
  return S.people.find(p => p.id === id) || { id, name: "Member", color: "#8e8e93", pin: "1234" };
}

function initials(name) {
  const parts = String(name || "?").trim().split(/\s+/);
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : parts[0].slice(0, 2).toUpperCase();
}

/* ==========================================================================
   7. BILL SPLITTING & 8% FIXED GST ENGINE
   ========================================================================== */
function blankBill() {
  return {
    title: "",
    date: today(),
    trip: tripFilter === "All" ? "" : tripFilter,
    payerId: currentUserId || (S.people[0] ? S.people[0].id : 1),
    gstEnabled: !!S.settings.defaultGst,
    scAmt: 0,
    scMode: "ord",
    other: 0,
    recTotal: 0,
    items: [],
    settled: {}
  };
}

function calcBill(b) {
  const idSet = new Set(S.people.map(p => p.id));
  if (b.payerId) idSet.add(b.payerId);
  (b.items || []).forEach(it => (it.w || []).forEach(pid => idSet.add(pid)));
  const ids = [...idSet];

  const subMap = {};
  ids.forEach(id => subMap[id] = 0);

  (b.items || []).forEach(it => {
    const sharers = (it.w || []).filter(id => idSet.has(id));
    const price = +it.p || 0;
    if (sharers.length > 0 && price > 0) {
      const share = price / sharers.length;
      sharers.forEach(id => { subMap[id] += share; });
    }
  });

  const activeIds = ids.filter(id => subMap[id] > 0);
  const totalSubRaw = sum(Object.values(subMap));
  const extraPool = r2((+b.scAmt || 0) + (+b.other || 0));
  const useProp = b.scMode === "prop" && totalSubRaw > 0;
  const subA = alloc(ids.map(id => subMap[id] || 0), r2(totalSubRaw));
  const gstRaw = subA.map(v => b.gstEnabled ? v * GST_RATE / 100 : 0);
  const gstA = alloc(gstRaw, r2(sum(gstRaw)));
  const extRaw = subA.map(v => extraPool !== 0 && activeIds.length
    ? (useProp ? extraPool * v / totalSubRaw : (v > 0 ? extraPool / activeIds.length : 0)) : 0);
  const extA = alloc(extRaw, r2(sum(extRaw)));
  const rows = ids.map((id, i) => ({
    personId: id, person: getPerson(id), sub: subA[i], gst: gstA[i], extra: extA[i],
    tot: r2(subA[i] + gstA[i] + extA[i])
  }));
  return {
    rows,
    totalSub: r2(sum(subA)),
    totalGst: r2(sum(gstA)),
    totalExtra: r2(sum(extA)),
    grandTotal: r2(sum(rows.map(r => r.tot)))
  };
}

/* Round to cents so the parts always add up exactly to the target (largest remainder) */
function alloc(vals, target) {
  const c = vals.map(v => Math.floor(v * 100 + 1e-7));
  let rem = Math.round(target * 100) - sum(c);
  vals.map((v, i) => [v * 100 - c[i], i]).sort((a, b) => b[0] - a[0])
    .forEach(([fr, i]) => { if (rem > 0 && fr > 1e-7) { c[i]++; rem--; } });
  return c.map(x => x / 100);
}

function getBillDues(bill) {
  const c = calcBill(bill);
  const settled = bill.settled || {};
  return c.rows
    .filter(r => r.personId !== bill.payerId && r2(r.tot) >= 0.01)
    .map(r => ({
      bill,
      fromId: r.personId,
      toId: bill.payerId,
      amount: r2(r.tot),
      isSettled: !!settled[r.personId]
    }));
}

function computeAllBalances() {
  const filteredBills = S.bills.filter(b => tripFilter === "All" || (b.trip || "") === tripFilter);
  const unsettledRows = [];
  const pairMap = {};

  filteredBills.forEach(b => {
    getBillDues(b).forEach(d => {
      if (!d.isSettled && d.toId) {
        unsettledRows.push(d);
        const key = `${d.fromId}->${d.toId}`;
        if (!pairMap[key]) pairMap[key] = { fromId: d.fromId, toId: d.toId, total: 0, items: [] };
        pairMap[key].total = r2(pairMap[key].total + d.amount);
        pairMap[key].items.push(d);
      }
    });
  });

  const pairs = Object.values(pairMap).sort((a, b) => b.total - a.total);
  const totalUnsettled = r2(sum(pairs.map(p => p.total)));
  const totalSpend = r2(sum(filteredBills.map(b => calcBill(b).grandTotal)));

  return { filteredBills, unsettledRows, pairs, totalUnsettled, totalSpend };
}

window.toggleBillPersonSettled = function(billId, personId) {
  const b = S.bills.find(x => x.id === billId);
  if (!b) return;
  b.settled = b.settled || {};
  if (b.settled[personId]) delete b.settled[personId];
  else b.settled[personId] = true;
  saveState();
  render();
};

window.settlePairAll = async function(fromId, toId) {
  if (toId !== currentUserId) return;
  const fromP = getPerson(fromId);
  const free = pairDues(fromId, toId).filter(d => !payOf(d.bill.id, fromId));
  if (!free.length) return showNotice("These bills already have a payment waiting for your confirmation. Open it from the notification above.", "Nothing to mark");
  const ok = await showConfirm(`Mark ${f(sum(free.map(d => d.amount)))} from ${fromP.name} as received (no slip)?`, "Mark received", "Mark received", false);
  if (!ok) return;
  free.forEach(d => { const b = S.bills.find(x => x.id === d.bill.id); if (b) { b.settled = b.settled || {}; b.settled[fromId] = true; } });
  saveState();
  render();
};

function viewDash() {
  const { filteredBills, pairs, totalUnsettled, totalSpend } = computeAllBalances();
  const trips = [...new Set(S.bills.map(b => b.trip).filter(Boolean))];
  const me = getPerson(currentUserId);

  let h = head("Overview", `Signed in as ${esc(me.name)} · ${S.people.length} members · ${S.bills.length} bill${S.bills.length === 1 ? "" : "s"}`);

  h += viewNotifs(me.id);

  h += `<div class="row2" style="margin-top:12px">
    <div class="tile"><small>Total Bills</small><b>${mh(totalSpend)}</b></div>
    <div class="tile"><small>Unsettled</small><b class="${totalUnsettled > 0.005 ? "neg" : "pos"}">${mh(totalUnsettled)}</b></div>
  </div>`;

  if (trips.length > 0) {
    h += `<div class="l" style="margin-top:12px">
      <div class="li">
        <span>Filter by Trip</span>
        <select onchange="tripFilter=this.value;render()">

  }

  h += `<div class="sh">Who owes whom</div><div class="l">`;
  if (pairs.length === 0) {
    h += `<div class="li mu">${filteredBills.length ? "All bills are settled! 🎉" : "No unsettled balances yet."}</div>`;
  } else {
    h += pairs.map(pair => {
      const fromP = getPerson(pair.fromId), toP = getPerson(pair.toId), meId = currentUserId;
      const btn = pair.fromId === meId ? `<button class="pill solid" onclick="openPay(${pair.toId})">Pay</button>`
        : pair.toId === meId ? `<button class="pill g" onclick="settlePairAll(${pair.fromId},${pair.toId})">Mark received</button>` : "";
      return `<div class="li col">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <span style="display:flex;align-items:center;gap:10px">
            <span class="dot" style="--c:${fromP.color}">${esc(initials(fromP.name))}</span>
            <span><b>${esc(fromP.name)}</b> owes <b>${esc(toP.name)}</b><br>
              <span class="neg">${mh(pair.total)}</span><small> · ${pair.items.length} bill${pair.items.length === 1 ? "" : "s"}</small></span>
          </span>${btn}
        </div>
        <div class="chips">${pair.items.map(d => `<span class="chip" style="cursor:pointer" onclick="openBill(${d.bill.id},'dash')">${esc(d.bill.title)} · ${f(d.amount)} ›</span>`).join("")}</div>
      </div>`;
    }).join("");
  }
  h += `</div>`;

  h += `<div style="margin-top:16px">
    <button class="btn" style="padding:16px;font-size:17px" onclick="startNewBill()">+ New Bill</button>
  </div>`;
  if (S.bills.length > 0) {
    h += `<div style="margin-top:10px">
      <button class="btn sec" onclick="go('hist')">View All Bills · ${S.bills.length}</button>
    </div>`;
  }

  return h;
}

function pastPlaces() {
  const seen = {}, out = [];
  S.bills.forEach(b => {
    const n = (b.title || "").trim(), k = n.toLowerCase();
    if (n && n !== "Untitled bill" && !seen[k]) { seen[k] = 1; out.push(n); }
  });
  return out;
}

function pastItems() {
  const seen = {}, out = [];
  S.bills.forEach(b => (b.items || []).forEach(it => {
    const n = (it.n || "").trim(), k = n.toLowerCase();
    if (n && !seen[k]) { seen[k] = 1; out.push({ n, p: +it.p || 0 }); }
  }));
  return out;
}

window.renderPreview = function() {
  const pv = document.getElementById("pv");
  if (!pv || !D) return;
  const c = calcBill(D);
  const activeRows = c.rows.filter(r => r.tot > 0 || r.sub > 0);

  let html = `<div class="li"><span>Items subtotal</span><b>${mh(c.totalSub)}</b></div>`;
  html += `<div class="li">
    <span>8% Fixed GST ${D.gstEnabled ? '<span class="bd ok" style="margin-left:4px">ON</span>' : '<span class="bd" style="margin-left:4px">OFF</span>'}</span>
    <b>${D.gstEnabled ? mh(c.totalGst) : "Off"}</b>
  </div>`;
  if (c.totalExtra !== 0) {
    html += `<div class="li"><span>Service / Other charges</span><b>${mh(c.totalExtra)}</b></div>`;
  }

  if (activeRows.length === 0) {
    html += `<div class="li mu">Add items and assign people to see each person's share and 8% GST.</div>`;
  } else {
    html += activeRows.map(r => `
      <div class="li">
        <span style="display:flex;gap:10px;align-items:center">
          <span class="dot" style="--c:${r.person.color}">${esc(initials(r.person.name))}</span>
          <span>
            <b>${esc(r.person.name)}</b>${r.personId === D.payerId ? '<span class="cp">payer</span>' : ""}<br>
            <small>Items ${f(r.sub)}${D.gstEnabled ? ` + 8% GST ${f(r.gst)}` : ""}${Math.abs(r.extra) > 0.004 ? ` + Extra ${f(r.extra)}` : ""}</small>
          </span>
        </span>
        <b>${mh(r.tot)}</b>
      </div>
    `).join("");
  }

  html += `<div class="li"><b>Grand Total</b><b style="font-size:19px">${mh(c.grandTotal)}</b></div>`;

  const rec = +D.recTotal || 0;
  if (rec > 0) {
    const diff = c.grandTotal - rec;
    html += Math.abs(diff) <= 0.015
      ? `<div class="li"><span>Receipt check</span><b class="pos">Matches receipt ✓</b></div>`
      : `<div class="li"><span>Receipt total (${f(rec)})</span><b class="neg">${diff > 0 ? "+" : "−"}${f(Math.abs(diff))} difference</b></div>
         <div class="li"><span class="mu">The receipt may round or tax differently. Add the difference to Other charges so totals match.</span><button type="button" class="pill solid" onclick="matchReceipt()">Match receipt</button></div>`;
  }

  pv.innerHTML = html;
};

window.saveCurrentBill = async function() {
  if (!D.payerId) return showNotice("Select who paid the bill.");
  if (!D.items.some(i => +i.p > 0)) return showNotice("Add at least one item with a price.");
  if (D.items.some(i => +i.p > 0 && !(i.w && i.w.length))) return showNotice("Select at least one person for every item.");

  const editId = D.editId;
  const bill = {
    id: editId || nextId(S.bills),
    title: (D.title || "").trim() || "Untitled bill",
    date: D.date || today(),
    trip: (D.trip || "").trim(),
    payerId: D.payerId,
    gstEnabled: !!D.gstEnabled,
    scAmt: +D.scAmt || 0,
    scMode: D.scMode || "ord",
    other: +D.other || 0,
    recTotal: +D.recTotal || 0,
    items: cl(D.items),
    settled: D.settled ? cl(D.settled) : {}
  };

  if (editId) {
    S.bills = S.bills.map(b => b.id === editId ? bill : b);
  } else {
    S.bills.unshift(bill);
  }

  saveState();
  D = blankBill();
  window.D = D;
  if (editId) {
    tab = "hist";
    openBillId = bill.id;
  } else {
    tab = "dash";
  }
  render();
  scrollTopMain();
};

window.openItemSheet = function(idx) {
  const it = idx >= 0 ? D.items[idx] : null;
  const pm = it && it.pm ? it.pm : "bill";
  const q = it ? (it.q || 1) : 1;
  const defaultSharers = it ? [...it.w] : [];

  sheet = {
    t: "item",
    k: idx,
    n: it ? it.n : "",
    pm,
    pr: it ? String(r2(pm === "unit" ? (+it.p || 0) / q : (+it.p || 0))) : "",
    q,
    w: defaultSharers
  };
  window.sheet = sheet;
  render();
  if (idx < 0) {
    setTimeout(() => {
      const inp = document.getElementById("isn");
      if (inp) inp.focus();
    }, 80);
  }
};

const sheetItemTotal = () => r2((+sheet.pr || 0) * (sheet.pm === "unit" ? sheet.q : 1));

window.updateItemSuggestions = function() {
  const q = (sheet.n || "").trim().toLowerCase(), box = document.getElementById("its");
  if (!box) return;
  itMatches = q ? pastItems().filter(x => x.n.toLowerCase().includes(q) && x.n.toLowerCase() !== q).slice(0, 20) : [];
  box.style.display = itMatches.length ? "block" : "none";
  box.innerHTML = itMatches.map((x, i) => `<div class="li" onclick="pickPastItem(${i})" style="cursor:pointer;min-height:44px"><span>${esc(x.n)}</span><span class="mu">${mh(x.p)}</span></div>`).join("");
};

window.pickPastItem = function(i) {
  const x = itMatches[i];
  if (!x) return;
  sheet.n = x.n;
  sheet.pm = "bill";
  sheet.pr = String(x.p);
  sheet.q = 1;
  render();
};

window.toggleSheetPerson = function(id) {
  const idx = sheet.w.indexOf(id);
  if (idx < 0) sheet.w.push(id);
  else sheet.w.splice(idx, 1);
  render();
};

function itemSheetLiveText() {
  const tot = sheetItemTotal(), q = sheet.q;
  const der = sheet.pm === "unit"
    ? (tot > 0 ? `Bill price: <b>${mh(tot)}</b>` : "Bill price = unit price × quantity")
    : (q > 1 && tot > 0 ? `Unit price: <b>${mh(tot / q)}</b>` : "Enter total item price from receipt");

  const n = sheet.w.length;
  const gstOn = !!D.gstEnabled;
  const baseA = n ? alloc(Array(n).fill(tot / n), tot) : [];
  const gstT = gstOn ? r2(tot * GST_RATE / 100) : 0;
  const gstA = n ? alloc(Array(n).fill(gstT / n), gstT) : [];
  const shares = n === 0
    ? '<div class="li mu">Select who shared this item to preview split.</div>'
    : sheet.w.map((id, i) => `<div class="li">
          <span>${esc(getPerson(id).name)}${gstOn && tot > 0 ? `<br><small>Item ${f(baseA[i])} + 8% GST ${f(gstA[i])}</small>` : ""}</span>
          <b>${mh(baseA[i] + gstA[i])}</b>
        </div>`).join("") + `<div class="li"><b>Item Total${gstOn ? " (incl. 8% GST)" : ""}</b><b>${mh(tot + gstT)}</b></div>`;

  return { der, shares };
}

window.updateItemSheetPreview = function() {
  const { der, shares } = itemSheetLiveText();
  const a = document.getElementById("itd"), b = document.getElementById("itp");
  if (a) a.innerHTML = der;
  if (b) b.innerHTML = shares;
};

window.saveSheetItem = function(addAnother) {
  const total = sheetItemTotal();
  if (!(total > 0)) return showNotice("Enter a valid price greater than 0.");
  if (!sheet.w.length) return showNotice("Select at least one person who shared this item.");

  const item = {
    n: (sheet.n || "").trim() || "Item",
    p: total,
    q: sheet.q,
    pm: sheet.pm,
    w: [...sheet.w]
  };

  if (sheet.k < 0) D.items.push(item);
  else D.items[sheet.k] = item;

  if (addAnother) {
    sheet = { t: "item", k: -1, n: "", pm: sheet.pm, pr: "", q: 1, w: [] };
    window.sheet = sheet;
    render();
    setTimeout(() => {
      const inp = document.getElementById("isn");
      if (inp) inp.focus();
    }, 80);
  } else {
    sheet = null;
    window.sheet = null;
    render();
  }
};

window.deleteSheetItem = function() {
  if (sheet && sheet.k >= 0) D.items.splice(sheet.k, 1);
  sheet = null;
  window.sheet = null;
  render();
};

    <div class="l" style="margin-top:10px">
      <div class="li"><span>${unit ? "Unit price" : "Bill price"}</span><input type="number" inputmode="decimal" step="any" placeholder="0.00" value="${esc(s.pr)}" oninput="sheet.pr=this.value;updateItemSheetPreview()"></div>
      <div class="li"><span>Quantity</span><span class="step"><button type="button" class="pill" onclick="sheet.q=Math.max(1,sheet.q-1);render()">−</button><b>${s.q}</b><button type="button" class="pill" onclick="sheet.q++;render()">+</button></span></div>
      <div class="li"><span class="mu" id="itd">${der}</span></div>
    </div>

    <div class="sh">Who shared this item?</div>
    <div class="chips" style="margin:0 0 6px">
      <button type="button" class="pill" onclick="sheet.w=S.people.map(p=>p.id);render()">Everyone</button>
      ${lastItem ? `<button type="button" class="pill" onclick="sheet.w=[...${JSON.stringify(lastItem.w)}];render()">Same as last</button>` : ""}

function billStatus(b) {
  const d = getBillDues(b);
  const pending = d.filter(x => !x.isSettled);
  if (d.length === 0 || pending.length === 0) return { label: "Settled", cls: "ok", sub: "" };
  return {
    label: `${pending.length} pending`,
    cls: "no",
    sub: pending.map(x => `${getPerson(x.fromId).name} owes ${mh(x.amount)}`).join(" · ")
  };
}

function viewHistory() {
  if (openBillId !== null) return viewBillDetail(openBillId);

  let h = head("Bills", `${S.bills.length} saved bill${S.bills.length === 1 ? "" : "s"}`);
  h += `<div class="l"><div class="li"><input type="search" placeholder="Search place, trip, item or person" value="${esc(histQuery)}" oninput="histQuery=this.value;document.getElementById('hl').innerHTML=renderHistoryList()" style="text-align:left"></div></div>`;
  h += `<div id="hl">${renderHistoryList()}</div>`;
  return h;
}

window.renderHistoryList = function() {
  const q = histQuery.trim().toLowerCase();
  const filtered = q
    ? S.bills.filter(b => [
        b.title, b.trip, getPerson(b.payerId).name,
        ...(b.items || []).map(i => i.n)
      ].join(" ").toLowerCase().includes(q))
    : S.bills;

  if (!filtered.length) {
    return `<div class="l" style="margin-top:14px"><div class="li mu">${q ? "No matching bills found." : "No bills saved yet. Create one in New Bill."}</div></div>`;
  }

  let h = "";
  const tripTotals = {};
  S.bills.forEach(b => {
    const k = b.trip || "General";
    tripTotals[k] = (tripTotals[k] || 0) + calcBill(b).grandTotal;
  });
  if (!q && Object.keys(tripTotals).length > 1) {
    h += `<div class="sh">Totals by Trip</div><div class="l">${Object.entries(tripTotals).map(([k, v]) => `<div class="li"><span>${esc(k)}</span><b>${mh(v)}</b></div>`).join("")}</div>`;
  }

  const byDate = {};
  filtered.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id - a.id).forEach(b => {
    const d = b.date || "Unknown";
    (byDate[d] = byDate[d] || []).push(b);
  });

  h += Object.keys(byDate).sort().reverse().map(d => {
    const daySum = sum(byDate[d].map(b => calcBill(b).grandTotal));
    return `<div class="sh" style="display:flex;justify-content:space-between"><span>${dayLabel(d)}</span><span>${mh(daySum)}</span></div>
    <div class="l">${byDate[d].map(b => {
      const c = calcBill(b), st = billStatus(b), payer = getPerson(b.payerId);
      return `<div class="li col" onclick="openBill(${b.id})" style="cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="flex:1;min-width:0">
            <b>${esc(b.title)}</b>${b.trip ? `<span class="cp">${esc(b.trip)}</span>` : ""}${b.gstEnabled ? `<span class="cp">8% GST</span>` : ""}
            <div class="mu">${shortDate(d)} · paid by ${esc(payer.name)}</div>
          </div>
          <div style="text-align:right;flex:none">
            <b>${mh(c.grandTotal)}</b><br>
            <span class="bd ${st.cls}">${st.label}</span>
          </div>
        </div>
        ${st.sub ? `<div class="mu" style="margin-top:5px">${st.sub}</div>` : ""}
      </div>`;
    }).join("")}</div>`;
  }).join("");

  return h;
};

function viewBillDetail(id) {
  const b = S.bills.find(x => x.id === id);

  const c = calcBill(b);
  const payer = getPerson(b.payerId);
  const activeRows = c.rows.filter(r => r.tot > 0.004);
  const dues = getBillDues(b);

  let h = headB(
    'style="margin-top:6px" onclick="closeBill()"',
    billFrom ? "‹ Back" : "‹ Bills",
    esc(b.title),
    `${shortDate(b.date)} · Paid by ${esc(payer.name)}${b.trip ? " · " + esc(b.trip) : ""}`
  );

  h += `<div class="l">
    <div class="li"><span>Items subtotal</span><b>${mh(c.totalSub)}</b></div>
    <div class="li"><span>8% Fixed GST</span><b>${b.gstEnabled ? mh(c.totalGst) : "Disabled"}</b></div>

  </div>`;

  h += `<div class="sh">Per-Person Breakdown</div>
  <div class="l">${activeRows.map(r => `
    <div class="li">
      <span style="display:flex;gap:10px;align-items:center">
        <span class="dot" style="--c:${r.person.color}">${esc(initials(r.person.name))}</span>
        <span>
          <b>${esc(r.person.name)}</b>${r.personId === b.payerId ? '<span class="cp">paid bill</span>' : ""}<br>
          <small>Items ${f(r.sub)}${b.gstEnabled ? ` + 8% GST ${f(r.gst)}` : ""}${Math.abs(r.extra) > 0.004 ? ` + Extra ${f(r.extra)}` : ""}</small>
        </span>
      </span>
      <b>${mh(r.tot)}</b>
    </div>
  `).join("")}</div>`;

  if (dues.length > 0) {
    const me = currentUserId;
    h += `<div class="sh">Settlement Status (Owed to ${esc(payer.name)})</div>
    <div class="l">${dues.map(d => {
      const p = getPerson(d.fromId), pend = payOf(b.id, d.fromId);
      const rej = !d.isSettled && !pend && S.payments.some(x => x.status === "rejected" && x.fromId === d.fromId && x.billIds.includes(b.id) && !x.ack);
      let act;
      if (d.isSettled) act = me === b.payerId ? `<button class="pill g" onclick="undoSettled(${b.id},${d.fromId})">Settled ✓</button>` : `<span class="bd ok">Settled ✓</span>`;
      else if (pend) act = `<button class="pill" onclick="openPayment(${pend.id})">${me === b.payerId ? "Review &amp; confirm" : "Awaiting confirmation"}</button>`;
      else if (me === d.fromId) act = `<button class="pill solid" onclick="openPay(${b.payerId},${b.id})">Pay &amp; attach slip</button>`;
      else if (me === b.payerId) act = `<button class="pill" onclick="markReceived(${b.id},${d.fromId})">Mark received</button>`;
      else act = `<span class="bd no">Unpaid</span>`;
      return `<div class="li"><span><b>${esc(p.name)}</b>${d.fromId === me ? '<span class="cp">you</span>' : ""}<br><small>${mh(d.amount)}</small>${rej ? '<br><small class="neg">Previous payment was rejected</small>' : ""}</span>${act}</div>`;
    }).join("")}</div>`;
  }

  h += `<div class="sh">Items (${(b.items || []).length})</div>
  <div class="l">${(b.items || []).map(it => {
    const names = (it.w || []).map(pid => getPerson(pid).name).join(", ") || "Nobody";
    return `<div class="li">
      <span><b>${esc(it.n || "Item")}</b>${(it.q || 1) > 1 ? ` <small>×${it.q}</small>` : ""}<br><small>${esc(names)}</small></span>
      <b>${mh(+it.p || 0)}</b>
    </div>`;
  }).join("")}</div>`;

  h += `<div class="row2" style="margin-top:18px">
    <button class="btn sec" onclick="useBillAsTemplate(${b.id})">Use as Template</button>
    <button class="btn sec" onclick="editSavedBill(${b.id})">Edit Bill</button>

  <div style="margin-top:10px">
    <button class="btn sec" style="color:var(--red)" onclick="deleteSavedBill(${b.id})">Delete Bill</button>
  </div>`;

  return h;
}

window.exportCsv = function() {
  const rows = [["Date", "Place", "Trip", "Paid By", "8% GST Enabled", "Person", "Items Subtotal", "8% GST", "Extra Charges", "Person Total", "Settled"].join(",")];
  S.bills.slice().reverse().forEach(b => {
    const c = calcBill(b), payer = getPerson(b.payerId).name;
    c.rows.forEach(r => {
      if (r.tot > 0 || r.sub > 0) {
        const isSettled = r.personId === b.payerId ? "Payer" : ((b.settled && b.settled[r.personId]) ? "Yes" : "No");
        rows.push([
          b.date, b.title, b.trip || "", payer, b.gstEnabled ? "Yes" : "No",
          r.person.name, r.sub.toFixed(2), r.gst.toFixed(2), r.extra.toFixed(2), r.tot.toFixed(2), isSettled
        ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","));
      }
    });
  });
  const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `splitmate-bills-${today()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
};

const expose = (n, g, st) => Object.defineProperty(window, n, { get: g, set: st, configurable: true });
expose("S", () => S, v => { S = v; });
expose("D", () => D, v => { D = v; });

expose("tab", () => tab, v => { tab = v; });

expose("tripFilter", () => tripFilter, v => { tripFilter = v; });
expose("histQuery", () => histQuery, v => { histQuery = v; });

expose("authError", () => authError, v => { authError = v; });

Object.assign(window, { blankBill, applyTheme, saveState, calcBill, getPerson });

   11. PAYMENTS, SLIPS & PAYER CONFIRMATION
   ========================================================================== */
let billFrom = null;
const METHODS = { bank: "Bank transfer", cash: "Cash", other: "Other" };
const payById = id => S.payments.find(p => p.id === id);
const payOf = (billId, fromId) => S.payments.find(p => p.status === "pending" && p.fromId === fromId && p.billIds.includes(billId));
const pairDues = (from, to) => S.bills
  .filter(b => (tripFilter === "All" || (b.trip || "") === tripFilter) && b.payerId === to)
  .flatMap(b => getBillDues(b).filter(d => d.fromId === from && !d.isSettled));

function notifCount() {
  const me = currentUserId;
  return S.payments.filter(p => (p.toId === me && p.status === "pending") || (p.fromId === me && p.status === "rejected" && !p.ack)).length
    + S.people.filter(p => p.id !== me && pairDues(me, p.id).some(d => !payOf(d.bill.id, me))).length;
}

function viewNotifs(me) {
  let h = "";
  const owe = S.people.filter(p => p.id !== me).map(p => {
    const free = pairDues(me, p.id).filter(d => !payOf(d.bill.id, me));
    return { p, free, amt: r2(sum(free.map(d => d.amount))) };
  }).filter(x => x.free.length);
  const totalOwe = r2(sum(owe.map(x => x.amt)));
  if (totalOwe > 0.004) {
    h += `<div class="sh" style="color:var(--red)">You owe ${mh(totalOwe)}</div>
    <div class="l" style="border:1.5px solid var(--red)">${owe.map(x => `<div class="li">
      <span style="display:flex;align-items:center;gap:10px"><span class="dot" style="--c:${x.p.color}">${esc(initials(x.p.name))}</span>
        <span>Pay <b>${esc(x.p.name)}</b><br><small>${x.free.length} bill${x.free.length === 1 ? "" : "s"}</small></span></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><b class="neg">${mh(x.amt)}</b>
        <button class="pill solid" onclick="openPay(${x.p.id})">Pay &amp; attach slip</button></span>
    </div>`).join("")}</div>`;
  }
  const toConfirm = S.payments.filter(p => p.toId === me && p.status === "pending");
  if (toConfirm.length) {
    h += `<div class="sh" style="color:var(--ac)">Confirm payments (${toConfirm.length})</div><div class="l" style="border:1.5px solid var(--ac)">${toConfirm.map(p => `<div class="li">
      <span><b>${esc(getPerson(p.fromId).name)}</b> sent <b>${mh(p.amount)}</b><br><small>${esc(p.method)} · ${p.billIds.length} bill${p.billIds.length === 1 ? "" : "s"}${p.hasSlip ? " · slip attached" : ""}</small></span>
      <button class="pill g" onclick="openPayment(${p.id})">Review</button></div>`).join("")}</div>`;
  }
  const mine = S.payments.filter(p => p.fromId === me && (p.status === "pending" || (p.status === "rejected" && !p.ack)));
  if (mine.length) {
    h += `<div class="sh">Your payments</div><div class="l">${mine.map(p => `<div class="li">
      <span>${p.status === "pending" ? `Waiting for <b>${esc(getPerson(p.toId).name)}</b> to confirm` : `<b>${esc(getPerson(p.toId).name)}</b> rejected`} <b>${mh(p.amount)}</b>${p.reason ? `<br><small class="neg">${esc(p.reason)}</small>` : ""}</span>
      <span style="display:flex;gap:6px"><button class="pill" onclick="openPayment(${p.id})">View</button>${p.status === "rejected" ? `<button class="pill r" onclick="ackPay(${p.id})">Dismiss</button>` : ""}</span></div>`).join("")}</div>`;
  }
  return h;
}

window.openPay = function(toId, billId) {

  if (!dues.length) return showNotice("Nothing left to pay here. A payment may already be waiting for confirmation.", "No payment due");
  sheet = { t: "pay", toId, sel: billId && dues.some(d => d.bill.id === billId) ? [billId] : dues.map(d => d.bill.id), method: "bank", note: "", slip: null, busy: false };

window.togglePaySel = function(id) {

window.pickSlip = function(inp) {
  const file = inp.files && inp.files[0];
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    if (sheet && sheet.t === "pay") { sheet.slip = c.toDataURL("image/jpeg", 0.7); render(); }
  };
  img.onerror = () => showNotice("Could not read that image. Please try another photo.", "Slip error");
  img.src = url;
};

function consumedHtml(b, uid) {
  const r = calcBill(b).rows.find(x => x.personId === uid);
  if (!r || r.tot <= 0) return "";
  const its = (b.items || []).filter(it => (it.w || []).includes(uid) && +it.p > 0);
  const sh = alloc(its.map(it => it.p / it.w.length), r.sub);
  const ln = (l, v, bold) => `<div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0;${bold ? "font-weight:700;border-top:.5px solid var(--bd);margin-top:4px;padding-top:6px" : ""}"><span>${l}</span><span>${v}</span></div>`;
  return `<div style="margin-top:10px;padding-top:8px;border-top:.5px solid var(--bd)">
    ${its.map((it, i) => ln(`${esc(it.n || "Item")}${(it.q || 1) > 1 ? ` <small class="mu">×${it.q}</small>` : ""}${it.w.length > 1 ? ` <small class="mu">(shared by ${it.w.length})</small>` : ""}`, f(sh[i]))).join("")}
    ${ln("Items subtotal", f(r.sub))}
    ${b.gstEnabled ? ln(`GST ${GST_RATE}% <small class="mu">on ${f(r.sub)}</small>`, f(r.gst)) : ""}
    ${Math.abs(r.extra) > 0.004 ? ln("Service / other share", f(r.extra)) : ""}
    ${ln("Total", f(r.tot), true)}
  </div>`;
}

function paySheet(s) {
  const to = getPerson(s.toId);
  const dues = pairDues(currentUserId, s.toId).filter(d => !payOf(d.bill.id, currentUserId));
  const total = r2(sum(dues.filter(d => s.sel.includes(d.bill.id)).map(d => d.amount)));
  const slipReq = s.method !== "cash";
  return `${headB('style="margin-top:6px" onclick="sheet=null;render()"', "‹ Cancel", "Pay " + esc(to.name), "Attach your payment and slip")}
  <div class="sh">Send to ${esc(to.name)}</div>
  <div class="l">${to.acct || to.phone
    ? [["Account number", to.acct], ["Phone number", to.phone]].filter(x => x[1]).map(([l, v]) => `<div class="li"><span><small>${l}</small><br><b style="-webkit-user-select:text;user-select:text">${esc(v)}</b></span><button type="button" class="pill" data-c="${esc(v)}" onclick="copyTxt(this)">Copy</button></div>`).join("")
    : `<div class="li mu">${esc(to.name)} hasn't added account details yet. Ask them directly.</div>`}</div>
  <div class="sh">Bills to settle &amp; what you consumed</div>
  <div class="l">${dues.map(d => { const on = s.sel.includes(d.bill.id); return `<div class="li col">
    <div onclick="togglePaySel(${d.bill.id})" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span><b>${esc(d.bill.title)}</b><br><small>${shortDate(d.bill.date)}</small></span>
      <span style="display:flex;gap:10px;align-items:center"><b>${mh(d.amount)}</b><span class="bd ${on ? "ok" : ""}">${on ? "✓" : "○"}</span></span>
    </div>${consumedHtml(d.bill, currentUserId)}</div>`; }).join("")}</div>
  <div class="sh">Payment</div>
  <div class="l">
    <div class="li"><b>Amount to pay</b><b style="font-size:19px">${mh(total)}</b></div>
    <div class="li col"><div class="mu" style="margin-bottom:6px">Method</div>${seg([["bank", "Bank transfer"], ["cash", "Cash"], ["other", "Other"]], s.method, "((m)=>{sheet.method=m;render()})")}</div>
    <div class="li"><span>Reference / note</span><input placeholder="Optional" value="${esc(s.note)}" oninput="sheet.note=this.value"></div>
  </div>
  <div class="sh">Payment slip ${slipReq ? "(required)" : "(optional)"}</div>
  <div class="l"><div class="li col">${s.slip
    ? `<img alt="Payment slip" src="${s.slip}" style="width:100%;border-radius:10px;display:block"><button type="button" class="pill r" style="margin-top:8px" onclick="sheet.slip=null;render()">Remove slip</button>`
    : `<label class="btn sec" style="margin:0">📎 Attach slip photo<input type="file" accept="image/*" style="display:none" onchange="pickSlip(this)"></label>`}</div></div>
  <div style="margin-top:16px"><button class="btn" onclick="submitPay()" ${s.busy ? "disabled" : ""}>${s.busy ? "Sending…" : "Submit payment"}</button></div>`;
}

window.submitPay = async function() {
  const s = sheet, me = currentUserId;
  if (!s || s.t !== "pay" || s.busy) return;
  const dues = pairDues(me, s.toId).filter(d => s.sel.includes(d.bill.id) && !payOf(d.bill.id, me));
  if (!dues.length) return showNotice("Select at least one bill to pay.");
  if (s.method !== "cash" && !s.slip) return showNotice("Attach your payment slip to continue.", "Slip required");
  const id = nextId(S.payments), amount = r2(sum(dues.map(d => d.amount))), toName = getPerson(s.toId).name;
  s.busy = true; render();
  if (s.slip) {
    try { await set(ref(db, "splitmate/slips/" + id), s.slip); }
    catch (e) { s.busy = false; render(); return showNotice("Could not upload the slip: " + e.message, "Upload failed"); }
  }
  S.payments.unshift({ id, fromId: me, toId: s.toId, billIds: dues.map(d => d.bill.id), amount, method: METHODS[s.method], note: (s.note || "").trim(), hasSlip: !!s.slip, status: "pending", at: Date.now() });
  saveState();
  sheet = null;
  render();
  showNotice(`Payment of ${f(amount)} sent to ${toName}. Your balance clears once ${toName} confirms it.`, "Payment submitted");
};

window.openPayment = async function(id) {
  sheet = { t: "review", id, slip: null, loading: true };
  render();
  const p = payById(id);
  if (p && p.hasSlip) {
    try { const snap = await get(ref(db, "splitmate/slips/" + id)); if (sheet && sheet.id === id) sheet.slip = snap.val(); } catch (e) { /* shows "No slip" */ }
  }
  if (sheet && sheet.id === id) { sheet.loading = false; render(); }
};

function reviewSheet(s) {
  const p = payById(s.id);
  const back = 'style="margin-top:6px" onclick="sheet=null;render()"';

  const st = p.status === "confirmed" ? ["ok", "Confirmed"] : p.status === "rejected" ? ["no", "Rejected"] : ["", "Awaiting confirmation"];
  const bills = p.billIds.map(id => S.bills.find(b => b.id === id)).filter(Boolean);
  return `${headB(back, "‹ Back", `${esc(from.name)} → ${esc(to.name)}`, `${shortDate(ldate(new Date(p.at)))} · ${esc(p.method)}`)}
  <div class="l">
    <div class="li"><b>Amount</b><b style="font-size:20px">${mh(p.amount)}</b></div>
    <div class="li"><span>Status</span><span class="bd ${st[0]}">${st[1]}</span></div>
    ${p.note ? `<div class="li"><span>Note</span><span>${esc(p.note)}</span></div>` : ""}
    ${p.reason ? `<div class="li"><span>Reason</span><span class="neg">${esc(p.reason)}</span></div>` : ""}
  </div>
  <div class="sh">Bills covered</div>
  <div class="l">${bills.map(b => `<div class="li col"><div onclick="openBill(${b.id},'${tab}')" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center"><span><b>${esc(b.title)}</b><br><small>${shortDate(b.date)}</small></span><span class="mu">›</span></div>${consumedHtml(b, p.fromId)}</div>`).join("") || '<div class="li mu">Bills were deleted.</div>'}</div>
  <div class="sh">Payment slip</div>
  <div class="l"><div class="li col">${s.loading ? '<div class="mu">Loading slip…</div>' : s.slip ? `<img alt="Payment slip" src="${s.slip}" style="width:100%;border-radius:10px;display:block">` : '<div class="mu">No slip attached.</div>'}</div></div>

  ${p.status === "pending" && p.fromId === currentUserId ? `<button class="btn sec" style="margin-top:16px" onclick="cancelPay(${p.id})">Cancel this payment</button>` : ""}`;
}

window.confirmPay = async function(id) {
  const p = payById(id);
  if (!p || p.toId !== currentUserId || p.status !== "pending") return;
  if (!(await showConfirm(`Confirm you received ${f(p.amount)} from ${getPerson(p.fromId).name}?`, "Confirm payment", "Yes, received"))) return;
  p.status = "confirmed"; p.decidedAt = Date.now();
  p.billIds.forEach(bid => { const b = S.bills.find(x => x.id === bid); if (b) { b.settled = b.settled || {}; b.settled[p.fromId] = true; } });
  saveState(); sheet = null; render();
};
window.rejectPay = async function(id) {
  const p = payById(id);
  if (!p || p.toId !== currentUserId || p.status !== "pending") return;
  const r = await showPrompt("Why are you rejecting this?", "Reject payment", "Optional reason", "");
  if (r === null) return;
  p.status = "rejected"; p.reason = String(r).trim(); p.decidedAt = Date.now();
  saveState(); sheet = null; render();
};
window.cancelPay = async function(id) {
  const p = payById(id);
  if (!p || p.fromId !== currentUserId || p.status !== "pending") return;
  if (!(await showConfirm("Cancel this payment request?", "Cancel payment", "Cancel payment", true))) return;
  S.payments = S.payments.filter(x => x.id !== id);
  set(ref(db, "splitmate/slips/" + id), null).catch(() => {});
  saveState(); sheet = null; render();
};
window.ackPay = function(id) {
  const p = payById(id);
  if (p) { p.ack = true; saveState(); render(); }
};
window.markReceived = async function(billId, fromId) {
  const b = S.bills.find(x => x.id === billId);
  if (!b || b.payerId !== currentUserId) return;
  const d = getBillDues(b).find(x => x.fromId === fromId);
  if (!d || payOf(billId, fromId)) return;
  if (!(await showConfirm(`Mark ${f(d.amount)} from ${getPerson(fromId).name} as received for "${b.title}"?`, "Mark received", "Mark received"))) return;
  b.settled = b.settled || {}; b.settled[fromId] = true;
  saveState(); render();
};
window.undoSettled = async function(billId, fromId) {
  const b = S.bills.find(x => x.id === billId);
  if (!b || b.payerId !== currentUserId) return;
  if (!(await showConfirm(`Mark ${getPerson(fromId).name}'s share of "${b.title}" as unpaid again?`, "Undo settlement", "Mark unpaid", true))) return;
  if (b.settled) delete b.settled[fromId];
  saveState(); render();
};


window.go = function(k) {
  tab = k;
  billFrom = null;
  sheet = null;
  openBillId = null;
  if (k === "new" && !D) D = blankBill();
  render();
  scrollTopMain();
};

window.render = function(opts) {
  renderAuth();

  const v = document.getElementById("v");
  const nav = document.getElementById("nav");
  const ovl = document.getElementById("ovl");

  if (currentUserId === null) {
    v.innerHTML = "";
    nav.style.display = "none";
    ovl.innerHTML = "";
    return;
  }
  nav.style.display = "flex";

  const scrollPos = v ? v.scrollTop : 0;
  const badgeCount = notifCount();
  const ae = document.activeElement;
  const typing = !!(opts && opts.fromRemote && ae && v.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName));

  const tabs = [
    ["dash", `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>`, "Overview"],
    ["new", `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`, "New Bill"],
    ["hist", `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`, "Bills"],
    ["people", `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`, "Users"]
  ];

  nav.innerHTML = tabs.map(([k, icon, label]) => `
    <button class="${tab === k ? "on" : ""}" onclick="go('${k}')">
      <span>${icon}</span>${label}
      ${k === "dash" && badgeCount > 0 ? `<em class="bg">${badgeCount > 99 ? "99+" : badgeCount}</em>` : ""}
    </button>
  `).join("");

  if (!typing) v.innerHTML = tab === "dash"
    ? viewDash()
    : tab === "new"
    ? viewNewBill()
    : tab === "hist"
    ? viewHistory()
    : viewPeopleAndData();

  const sheetScroll = (document.querySelector("#ovl .w") || {}).scrollTop || 0;
  if (!(opts && opts.fromRemote && ovl.contains(ae))) ovl.innerHTML = renderSheetHtml();
  const newSheetEl = document.querySelector("#ovl .w");
  if (newSheetEl) newSheetEl.scrollTop = sheetScroll;

  if (tab === "new") {
    renderPreview();
    updatePlaceSuggestions();
  }
  if (sheet && sheet.t === "item") {
    updateItemSuggestions();
  }

  v.scrollTop = scrollPos;
};

["gesturestart", "gesturechange", "gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault())
);
if (window.visualViewport) {
  const fitViewport = () => {
    document.body.style.height = visualViewport.height + "px";
    document.body.style.width = visualViewport.width + "px";
    document.body.style.bottom = "auto";
    window.scrollTo(0, 0);
  };
  visualViewport.addEventListener("resize", fitViewport);
  fitViewport();
}

window.matchReceipt = function() {
  const rec = +D.recTotal || 0;
  if (!(rec > 0)) return;
  const diff = r2(rec - calcBill(D).grandTotal);
  D.other = r2((+D.other || 0) + diff);
  render();
};

/* ---- installable web app (PWA) ---- */
let installEv = null;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEv = e; if (currentUserId !== null && tab === "people") render(); });
window.addEventListener("appinstalled", () => { installEv = null; if (currentUserId !== null) render(); });
window.installApp = async function() {
  if (!installEv) return;
  installEv.prompt();
  try { await installEv.userChoice; } catch (e) {}
  installEv = null;
  render();
};
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

applyTheme();
D = blankBill();
render();
</script>
</body>
</html>
